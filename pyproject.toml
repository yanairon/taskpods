[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskpods"
version = "0.4.0"
description = "Parallel AI task pods via git worktrees"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Yanai Ron", email = "yanai.ron@gmail.com"}
]
maintainers = [
    {name = "Yanai Ron", email = "yanai.ron@gmail.com"}
]
keywords = ["git", "worktree", "ai", "development", "workflow", "parallel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/yanairon/taskpods"
Documentation = "https://github.com/yanairon/taskpods#readme"
Repository = "https://github.com/yanairon/taskpods.git"
Issues = "https://github.com/yanairon/taskpods/issues"
Changelog = "https://github.com/yanairon/taskpods/blob/main/CHANGELOG.md"

[project.scripts]
taskpods = "taskpods:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.3.1",
    "packaging>=21.0.0",
    "pre-commit>=4.6.2",
    "coverage>=7.16.0",
    "bandit>=1.9.4",
    "safety>=3.8.1",
    "build>=1.6.0",
    "twine>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools]
py-modules = ["taskpods"]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--junitxml=test-results.xml",
    "--junit-prefix=taskpods",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501", "E402", "D103"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".taskpods",
]

[tool.coverage.run]
source = ["taskpods"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
